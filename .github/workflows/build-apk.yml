name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build GIA Studio APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install/verify Android SDK 35
        shell: bash
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            yes | "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          else
            echo "cmdline-tools not found at $SDKM — relying on preinstalled SDK"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      - name: Build debug and release APKs
        shell: bash
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: gia-studio-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
