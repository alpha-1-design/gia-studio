name: build-apk

on:
  push:
    branches: [main]
    paths-ignore:
      - build-error.txt
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build GIA Studio APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (accepts licenses, puts sdkmanager on PATH)
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null 2>&1 || \
            echo "sdkmanager install skipped — Gradle will resolve the NDK itself"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      # The release APK must stay signed with ONE stable key so over-the-air
      # updates install over the previous version. The key is generated once
      # and cached; if the cache ever evicts, the app must be reinstalled
      # (Settings in the app explains updates come from GitHub Releases).
      - name: Cache signing keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: ~/.gia-keys
          key: gia-keystore-v1

      - name: Generate signing keystore (first run only)
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ~/.gia-keys
          keytool -genkeypair -keystore ~/.gia-keys/gia-release.jks \
            -alias gia -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass giastudio123 -keypass giastudio123 \
            -dname "CN=GIA Studio, OU=Mobile, O=GIA Studio, L=Earth, C=US"

      - name: Configure release signing
        shell: bash
        run: |
          cp ~/.gia-keys/gia-release.jks app/gia-release.jks
          printf 'storeFile=gia-release.jks\nstorePassword=giastudio123\nkeyAlias=gia\nkeyPassword=giastudio123\n' > app/keystore.properties

      - name: Build debug and release APKs (with native core)
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug assembleRelease -PwithNative --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          exit ${PIPESTATUS[0]}

      - name: Upload gradle log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          if-no-files-found: ignore

      - name: Save failure log into the repo
        if: failure()
        shell: bash
        run: |
          tail -n 400 /tmp/gradle.log > build-error.txt 2>/dev/null || echo 'no gradle log' > build-error.txt
          git config user.email "actions@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add build-error.txt
          git commit -m "ci: record build failure from run ${GITHUB_RUN_ID}" --allow-empty >/dev/null 2>&1 || true
          git push origin main || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: gia-studio-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # OTA channel: publish the signed release APK as a GitHub Release.
      # The app checks releases/latest in Settings → Check for updates.
      - name: Stage release APK
        shell: bash
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VER=$VER" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "GIA-Studio-v${VER}.apk"
          ls -la "GIA-Studio-v${VER}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: GIA Studio v${{ env.VER }}
          body: |
            Automatic build from main.

            What's in this version (see the app's Help tab for details):
            - Everything from previous builds, plus the newest features.
            - Install or update over the air: open the app → Settings → Check for updates.
          files: GIA-Studio-v${{ env.VER }}.apk
          overwrite: true
          fail_on_unmatched_files: false