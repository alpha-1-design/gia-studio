name: build-apk

on:
  push:
    branches: [main]
    paths-ignore:
      - build-error.txt
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build GIA Studio APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install/verify Android SDK 35
        shell: bash
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            yes | "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          else
            echo "cmdline-tools not found at $SDKM — relying on preinstalled SDK"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      - name: Build debug and release APKs
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          exit ${PIPESTATUS[0]}

      - name: Upload gradle log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          if-no-files-found: ignore

      - name: Save failure log into the repo
        if: failure()
        shell: bash
        run: |
          tail -n 400 /tmp/gradle.log > build-error.txt 2>/dev/null || echo 'no gradle log' > build-error.txt
          git config user.email "actions@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add build-error.txt
          git commit -m "record build error" --allow-empty >/dev/null 2>&1 || true
          git push origin main || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: gia-studio-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
